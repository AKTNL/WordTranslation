name: Release PaperDict Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Extension Automated Tests
        run: |
          npm test

      - name: Package Extension into ZIP
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "Packaging PaperDict for version: $VERSION"
          cd extension
          zip -r ../paperdict-${VERSION}.zip ./*
          cd ..
          ls -lh paperdict-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paperdict-*.zip
          name: PaperDict ${{ github.ref_name }} - PDF 转 HTML 文本视图、双视图笔记互通与高亮加固
          body: |
            ### 🚀 PaperDict ${{ github.ref_name }} 重大版本发布！

            专为阅读英文学术论文（网页与 PDF）量身打造的轻量级“划词即翻”、就地双语速读与深度学术研读浏览器扩展。
            **${{ github.ref_name }}** 带来重磅的 **PDF 转 HTML 文本重排视图**、**双向高亮笔记互通**与**跨节点高亮切片加固**，让阅读器同时具备原版版面排版与原生网页级顺滑交互！

            ---

            #### ✨ ${{ github.ref_name }} 核心更新与亮点

            1. 📄 **PDF 转 HTML 文本重排视图 (Reflow View)**：
               - **原版与 HTML 自由切换**：工具栏新增「原版页面 / HTML 文本」切换，复用学术双栏段落聚类算法，将每页 PDF 智能重排为真实语义化 DOM 段落；
               - **彻底释放原生交互能力**：在 HTML 模式下，划词查词、悬浮卡片、高亮选区与笔记批注完全对齐原生网页交互，彻底告别 PDF canvas 与底层 textLayer 的选区受限和排版错位；
               - **渐进渲染与竞态防护**：采用分页渐进构建（每 4 页出让一次事件循环）并配备 `htmlBuildToken` 竞态取消机制，大文件阅读与视图切换流畅零卡顿。

            2. 🖍️ **半透明墨水底色与跨节点分段高亮加固**：
               - **半透明柔光底色**：高亮颜色全面升级为半透明 `rgba(..., 0.45)` 并使用 `box-decoration-break: clone`，彻底杜绝实心色块遮挡底层 PDF 文字字形；
               - **选区智能分段切片**：引入 `splitRangeIntoSegments` 算法，将跨行、跨元素的复杂选区拆解为单文本节点切片并采用逆序包裹（Reverse-Order Wrapping），彻底根除原生 `Range.surroundContents` 抛错异常；
               - **数据结构增强**：批注存储新增 `segments` 数组与全文持久化，一键清除支持整组分段标记批量移除。

            3. 🔄 **双视图高亮笔记互通与跨视图文本归一化匹配**：
               - **视图作用域隔离恢复**：通过 `__paperDictHighlightContext` 上下文钩子，将恢复逻辑严格限定在当前可见视图内，解决双 DOM 共存时被隐藏容器提前抢占恢复导致的“切换视图笔记消失”问题；
               - **跨视图文本归一化算法**：新增 `normalizePaperMatch` 与 `normalizeTextIndex`，在字符映射表上同构清洗连字符断词、排版引号与破折号，保证任意视图划选的高亮在另一视图精准定位还原；
               - **文档标识 docKey 修复**：按 PDF 文件名或 `?file=` 参数精准解析文档标识，彻底修复所有 PDF 串台共享同一个 docKey 的问题；
               - **笔记与抽屉实时联动**：新增 `paperdict:annotations-changed` DOM 事件，配合 storage 监听，批注增删改即时更新徽标与抽屉。

            4. 🌐 **HTML 文本视图功能全量对齐**：
               - **段落级视口懒翻译**：在 HTML 视图下实现视口懒翻译管线（`IntersectionObserver`），支持【双语对照】、【纯中文速读】与 `Alt+B` 极速切换，复用公式保护与后台翻译缓存；
               - **工具栏精简常驻**：将缩放按扭收拢在 `#zoom-buttons`（HTML 模式自适应隐藏），保留「术语表」与「论文笔记」常驻；
               - **页码联动与导航**：常驻页码控件，支持 `scrollToPage` 滚动定位，并随滚动动态更新页码；
               - **术语广播桥接**：阅读器提取的专属术语通过事件广播给 `content.js`，让划词查词也能直接命中本篇论文专有术语。

            5. 📝 **统一规范的 Markdown 导出**：
               - 单篇与多篇导出格式全面对齐，标准化 YAML frontmatter、表格管道符转义与 ISO 日期（`YYYY-MM-DD`）。

            6. 🧪 **测试套件全面扩充与规范强化**：
               - 新增 `tests/test_highlights.js`（包含 44 项断言），全套 13 大测试套件（452 项断言）及 7 大体验诊断测试 100% 稳定通过。

            ---

            #### 🚀 极速安装步骤（Chrome / Edge 通用）
            1. 下载下方的 **`paperdict-${{ github.ref_name }}.zip`** 资源文件。
            2. 将下载的 ZIP 压缩包**解压到电脑任意文件夹**。
            3. 打开浏览器扩展管理页面：
               - Chrome 访问：`chrome://extensions/`
               - Edge 访问：`edge://extensions/`
            4. 打开右上角（或左下角）的 **「开发者模式」**。
            5. 点击 **「加载已解压的扩展程序」**（Load unpacked），选择刚才解压出来的文件夹即可开始使用！
            6. *(提示)* 若需直接在浏览器打开本地下载的 PDF 划词，请在扩展详细信息中勾选 **「允许访问文件网址」**。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
