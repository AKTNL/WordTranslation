name: Release PaperDict Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Extension Automated Tests
        run: |
          npm test

      - name: Package Extension into ZIP
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "Packaging PaperDict for version: $VERSION"
          cd extension
          zip -r ../paperdict-${VERSION}.zip ./*
          cd ..
          ls -lh paperdict-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paperdict-*.zip
          name: PaperDict ${{ github.ref_name }} - 长文本翻译稳定性与悬浮界面交互优化
          body: |
            ### 🚀 PaperDict ${{ github.ref_name }} 版本发布！

            专为阅读英文学术论文（网页与 PDF）量身打造的轻量级“划词即翻”、就地双语速读与深度学术研读浏览器扩展。
            **v2.3.1** 重点增强了公共翻译引擎处理长文本与长句时的稳定性，并全面改善了划词翻译卡片与双语控制胶囊的视口定位、拖拽防误触与边界交互体验！

            ---

            #### ✨ v2.3.1 核心更新与修复

            1. 🌐 **公共翻译引擎长文本与异常容错优化**：
               - **500 字符限制规避**：针对 MyMemory 500 字符上限，单次请求长度超限时主动短路并直接分流至 Google 翻译，彻底解决学术论文长难句或长段落翻译失败问题；
               - **错误信息过滤与优雅回退**：精准识别 MyMemory 返回的超长错误消息（如 `QUERY LENGTH LIMIT EXCEEDED`），杜绝将接口限制提示作为中文译文展示，并在被拒后自动回退到 Google 引擎。

            2. 🎯 **划词悬浮图标与卡片定位体验加固**：
               - **拖拽防误触查词**：拖拽“译”悬浮图标时加入合成 `click` 拦截机制与安全延时重置，杜绝拖动图标松开鼠标后意外误触发查词弹窗；
               - **首帧尺寸补偿**：解决卡片首次插入尚未完成 DOM 布局（宽/高读取为 0）时被错误定位到视口左上角的问题，自动通过 `requestAnimationFrame` 在下一帧二次校正；
               - **视口安全边界与尺寸约束**：增加 `getCardDimensions` 与 `clampCardPosition` 安全边界计算，限制卡片最大高度 `max-height: calc(100vh - 20px)`，杜绝卡片或关闭按钮超出可视屏幕；
               - **Shadow DOM 穿透拖拽修复**：拖拽事件直接绑定至 `cardEl`，并通过 `composedPath` 准确识别标题栏拖拽手柄。

            3. 🧩 **双语控制胶囊视口贴合与拖拽交互**：
               - **展开就地防溢出**：新增 `keepPanelInViewport`，控制胶囊在屏幕右边缘展开为宽面板（290px）时自动向内贴合修正坐标，避免面板被屏幕边缘截断；
               - **窗口 Resize 响应**：监听窗口大小变动，动态重算并保持面板在可视区内；
               - **分状态拖拽手柄**：收起状态下允许拖动悬浮球（且不触发点开），展开状态下仅响应标题栏拖拽（避开最小化按钮）；
               - **生命周期完整清理**：销毁胶囊时移除 resize 监听与重置定时器，防止潜在内存泄漏。

            4. 🧪 **全套自动化测试回归**：
               - 新增针对 MyMemory 长文本分流、拖拽防误触、卡片首帧测量重算与胶囊视口贴合边界计算的完整单元测试；
               - 全部 11 个测试套件（344 项断言）及全面体验诊断测试 100% 保持通过。

            ---

            #### 🚀 极速安装步骤（Chrome / Edge 通用）
            1. 下载下方的 **`paperdict-${{ github.ref_name }}.zip`** 资源文件。
            2. 将下载的 ZIP 压缩包**解压到电脑任意文件夹**。
            3. 打开浏览器扩展管理页面：
               - Chrome 访问：`chrome://extensions/`
               - Edge 访问：`edge://extensions/`
            4. 打开右上角（或左下角）的 **「开发者模式」**。
            5. 点击 **「加载已解压的扩展程序」**（Load unpacked），选择刚才解压出来的文件夹即可开始使用！
            6. *(提示)* 若需直接在浏览器打开本地下载的 PDF 划词，请在扩展详细信息中勾选 **「允许访问文件网址」**。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
