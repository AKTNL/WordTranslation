name: Release PaperDict Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Extension Automated Tests
        run: |
          npm test

      - name: Package Extension into ZIP
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "Packaging PaperDict for version: $VERSION"
          cd extension
          zip -r ../paperdict-${VERSION}.zip ./*
          cd ..
          ls -lh paperdict-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paperdict-*.zip
          name: PaperDict ${{ github.ref_name }} - 默认静默与单页面按需激活 (Phase 3) 与学术图表过滤升级
          body: |
            ### 🚀 PaperDict ${{ github.ref_name }} 重大版本发布！

            专为阅读英文学术论文（网页与 PDF）量身打造的轻量级“划词即翻”、就地双语速读与深度学术研读浏览器扩展。
            **v2.4.0** 带来备受期待的 **Phase 3 默认静默与单页面按需手动激活** 机制，彻底告别日常浏览的弹窗打扰；同时引入学术图表与复杂表格的精准过滤识别，并深度加固了内置 PDF 阅读器的翻译稳定性！

            ---

            #### ✨ v2.4.0 核心更新与亮点

            1. 🔕 **默认静默与单页面按需激活 (Phase 3 重磅功能)**：
               - **默认完全静默**：新开标签页及浏览器启动后，插件在普通网页中默认处于**关闭/静默状态**（不监听划词、不弹出卡片、不注入速读胶囊），扩展图标显示灰色 `OFF` 徽标（#64748b），彻底零干扰；
               - **内置阅读器专属豁免**：PaperDict 专用学术 PDF 阅读器（`reader.html`）作为专有学术工作区，保持默认开启并展示绿色 `ON` 徽标（#10b981）；
               - **极速唤醒快捷键**：新增 `Alt+P` 快捷键（支持 manifest 命令与页面防抖回退机制），按下即可在当前页面快速【开启/关闭】划词与翻译；
               - **Popup 顶部总控开关**：弹窗头部新增大卡片主开关，实时展示当前页面域名、激活状态与快捷键提示，点击即切换；
               - **单页内存状态严格隔离**：每个标签页的开启状态严格保存在当前标签页内存中，严禁全局持久化污染其他标签页，不同网页互不干扰；
               - **彻底的安全清理与恢复**：关闭当前页面翻译时，自动隐藏悬浮卡片、清理划词锚点、销毁双语速读胶囊并调用 `restoreOriginalView()` 彻底恢复网页原始 DOM 纯净状态。

            2. 📊 **论文正文图表、数据表格与题注精准过滤**：
               - **结构级元素排除**：自动过滤 `TABLE`、`THEAD`、`TBODY`、`TFOOT`、`TR`、`TH`、`TD`、`CAPTION`、`FIGURE`、`FIGCAPTION` 等 HTML 标签；
               - **ARIA 角色与容器模式过滤**：精准识别并排除 `figure`、`table`、`caption`、`grid`、`gridcell` 等 ARIA 角色及 `table-wrapper`、`figure-container`、`chart_box`、`plot` 等容器，杜绝误伤 `comfortable`、`portable` 等正常学术词汇；
               - **智能题注与指标数据排除**：识别并过滤独立图表题注（如 `Figure 1:`、`Table 2.`）以及 Markdown 表格、TSV 表格与密集数值指标，同时严格保留 `Figure 1 shows ...` 等正常解释性学术正文；
               - **PDF 阅读器段落聚类优化**：在 PDF 段落提取与聚类过程中同步剔除表格与图表题注，避免翻译碎片污染。

            3. ⚡ **内置 PDF 阅读器稳定性与并发加固**：
               - **安全请求 ID 与索引修复**：修复 `translatePageParagraphs` 批量翻译请求中的索引计算与异常捕获，避免未定义索引抛出错误；
               - **并发页面渲染任务清理**：在重复或连续触发同页面渲染时，主动清理取消既有正在进行的渲染任务，保证渲染流畅不闪烁；
               - **双语控制快捷键防抖**：针对 `Alt+B` 注入 250ms 防抖保护，避免连续敲击快捷键导致的模式切换冲突。

            4. 🧪 **全套自动化测试回归与规范强化**：
               - 新增 `tests/test_page_activation.js` 覆盖快捷键注册、徽标切换、隔离存储、DOM 还原与防抖等全部生命周期测试；
               - 新增学术图表过滤与题注边界的完备单测，全套 12 大测试套件（422 项断言）及 7 大体验诊断测试 100% 稳定通过。

            ---

            #### 🚀 极速安装步骤（Chrome / Edge 通用）
            1. 下载下方的 **`paperdict-${{ github.ref_name }}.zip`** 资源文件。
            2. 将下载的 ZIP 压缩包**解压到电脑任意文件夹**。
            3. 打开浏览器扩展管理页面：
               - Chrome 访问：`chrome://extensions/`
               - Edge 访问：`edge://extensions/`
            4. 打开右上角（或左下角）的 **「开发者模式」**。
            5. 点击 **「加载已解压的扩展程序」**（Load unpacked），选择刚才解压出来的文件夹即可开始使用！
            6. *(提示)* 若需直接在浏览器打开本地下载的 PDF 划词，请在扩展详细信息中勾选 **「允许访问文件网址」**。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
