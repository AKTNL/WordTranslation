name: Release PaperDict Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Extension Automated Tests
        run: |
          node tests/test_extension.js

      - name: Package Extension into ZIP
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "Packaging PaperDict for version: $VERSION"
          cd extension
          zip -r ../paperdict-${VERSION}.zip ./*
          cd ..
          ls -lh paperdict-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paperdict-*.zip
          name: PaperDict ${{ github.ref_name }} - 人性化体验重构与学术生词本升级
          body: |
            ### 🚀 PaperDict ${{ github.ref_name }} 重大版本发布！

            专为阅读英文学术论文（网页与 PDF）量身打造的轻量级“划词即翻”与就地双语速读浏览器扩展。
            **v2.2.0** 迎来了重磅的人性化体验全面重构，告别弹窗打扰，新增学术生词本与 Anki 导出，论文阅读更加得心应手！

            ---

            #### ✨ v2.2.0 核心更新与亮点

            1. 🕊️ **灵活优雅的划词触发（三大模式自由切换）**：
               - **【划选直接秒弹】（默认）**：松开鼠标瞬间即出释义卡片，搭载 80ms 智能防抖；
               - **【轻量悬浮图标】**：划选后仅在光标旁浮现精致小蓝标（`P`），点击才展开卡片，绝不遮挡视线与打扰复制；
               - **【快捷键触发】**：按住 `Alt`（或 `Ctrl` / `Shift`）划选才查词，平时划选纯净复制；
               - **智能防误触**：排除代码语句（`for`, `function`）、单字母变量（$x, y$）与中文混排，支持名词所有格（`model's` $\to$ `model`）自动还原。

            2. 📌 **卡片自由拖拽与图钉固定（Pin）**：
               - 悬浮释义卡片头部支持按住自由拖拽至任意空白位置；
               - 增加 📌 图钉固定按钮，开启后点击外部网页不关闭，方便对照研读与论文写作。

            3. ⭐ **学术生词本与 Anki 记忆卡片导出**：
               - 卡片头部支持一键 ⭐ 收藏生词；
               - Popup 弹窗新增【生词本】与【查词历史】抽屉，支持一键导出为 **Anki 兼容卡片（TXT）** 与 **CSV 表格**，实现查词到背诵的完整学习闭环。

            4. 🌙 **全界面自适应 Dark Mode 深色主题**：
               - 悬浮卡片、Popup 面板与阅读器全面适配深色模式，夜间阅读温和护眼。

            5. ⚡ **MV3 本地持久化缓存与自定义 AI 翻译**：
               - 翻译缓存持久化至 `chrome.storage.local`，彻底解决浏览器 Service Worker 休眠后缓存丢失被限流的问题；
               - 新增【自定义 API】配置，支持绑定自己的 DeepL 或 OpenAI 兼容大模型（如 DeepSeek、Kimi、GLM、OpenAI）API Key。

            6. 📄 **学术 PDF 阅读器性能与双栏优化**：
               - **长论文虚拟化按需加载**：50+ 页长论文秒开不卡顿，缩放时平滑锚定当前阅读位置；
               - **双栏论文排版智能识别**：基于 X 轴与水平投影分离左右两栏，依序提取成段，彻底杜绝跨栏文本交叉错乱；
               - **取消强制劫持**：默认不再强制重定向系统 PDF，将控制权还给用户。

            7. 📖 **就地全文双语对照与全中文速读（延续 Phase 2 强劲功能）**：
               - 快捷键 `Alt+B` 一键切换【双语对照】、【纯享中文】、【原版英文】；
               - 视口流式懒加载，严密保护 LaTeX 公式与数学符号，自动跳过 References 参考文献。

            ---

            #### 🚀 极速安装步骤（Chrome / Edge 通用）
            1. 下载下方的 **`paperdict-${{ github.ref_name }}.zip`** 资源文件。
            2. 将下载的 ZIP 压缩包**解压到电脑任意文件夹**。
            3. 打开浏览器扩展管理页面：
               - Chrome 访问：`chrome://extensions/`
               - Edge 访问：`edge://extensions/`
            4. 打开右上角（或左下角）的 **「开发者模式」**。
            5. 点击 **「加载已解压的扩展程序」**（Load unpacked），选择刚才解压出来的文件夹即可开始使用！
            6. *(提示)* 若需直接在浏览器打开本地下载的 PDF 划词，请在扩展详细信息中勾选 **「允许访问文件网址」**。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
