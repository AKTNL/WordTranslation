name: Release PaperDict Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Extension Automated Tests
        run: |
          npm test

      - name: Package Extension into ZIP
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "Packaging PaperDict for version: $VERSION"
          cd extension
          zip -r ../paperdict-${VERSION}.zip ./*
          cd ..
          ls -lh paperdict-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paperdict-*.zip
          name: PaperDict ${{ github.ref_name }} - 深度学术阅读工作台与专业术语库升级
          body: |
            ### 🚀 PaperDict ${{ github.ref_name }} 重大版本发布！

            专为阅读英文学术论文（网页与 PDF）量身打造的轻量级“划词即翻”、就地双语速读与深度学术研读浏览器扩展。
            **v2.3.0** 迎来了重磅的**深度学术阅读工作台**与**专业学科术语库**全面升级，融入高亮批注笔记、文献引用卡片、AI 语境导读与 Markdown 导出，配合更加严密的术语保护与引擎隐私安全，助你高效研读前沿论文！

            ---

            #### ✨ v2.3.0 核心更新与亮点

            1. 🖊️ **4 色学术高亮与就地批注笔记系统**：
               - **四色学术荧光笔**：黄色（核心要点）、绿色（创新方法）、蓝色（重要结论）、粉色（疑问难点），具象化笔触质感与清除橡皮擦；
               - **就地批注卡片**：点击已高亮文本稳定弹出批注卡片，记录研读心得，无闪烁困扰；
               - **Markdown 笔记系统导出**：
                 - 单篇论文阅读笔记（含 YAML frontmatter、高亮批注、术语表及生词表）；
                 - 多篇文献汇总研读报告（按论文结构化归档）；
                 - 生词本独立 Markdown 表格导出（完美兼容 Obsidian / Notion）。

            2. 🧠 **专业学科术语库与自定义术语管理**：
               - **内置 5 大学科高频术语包**：计算机与 AI、通用学术与统计、材料工程、生物医学、经济与社会科学；
               - **自定义术语库**：Popup 弹窗支持添加、编辑、删除与搜索自定义术语；支持 UTF-8 CSV / JSON 文件批量导入与导出；
               - **严格术语保护回填**：整句/整页翻译前通过 `PDTERM_n` 占位符隔离并带数字边界保护，翻译后精准回填，保持学术译法严谨一致。

            3. 📖 **学术引用标记悬浮卡片与文献直达**：
               - 正文引用标记（如 `[12]`、`[3-5]`）鼠标悬浮即时弹出参考文献悬浮卡片，无需滚动翻找文末；
               - 自动解析文献并生成 **DOI**、**arXiv** 与 **Google Scholar** 一键直达跳转链接。

            4. 💡 **论文专属术语提取与 AI 语境导读**：
               - 论文独有缩写与定义自动提取（GlossaryExtractor），学术生词优先基于论文上下文精准释义；
               - 新增 AI 语境导读入口，深度剖析复杂学术术语在特定段落中的语义内涵。

            5. 🛡️ **翻译引擎严格路由与隐私安全防护**：
               - 解耦独立模块化 `TranslationService`，全面支持 OpenAI 兼容 API（DeepSeek、Kimi、GLM、OpenAI）与 DeepL API；
               - **拒绝静默降级**：用户私有 API 认证失败或限流时原样报错，坚决不向公共接口转发，切实保护未发表论文的隐私；
               - **API Key 本地安全隔离**：敏感 Key 隔离保存在 `chrome.storage.local`，不再明文同步到云端；
               - Popup 设置面板提供真实“测试连接”功能。

            6. ⚡ **交互防误触与扩展生命周期稳定加固**：
               - 统一纯英文输入判定（`DictService.isEnglishSourceText`），彻底过滤中文及混排误触；
               - 浮动选区实时锚点（`SelectionAnchor`），随页面与嵌套容器滚动/窗口缩放丝滑跟随，过期异步请求代际隔离；
               - 扩展重载恢复机制（`tab_bridge.js`），优雅解决开发模式与更新后的扩展孤儿通信失效；
               - 全组件防折行与高分辨率适配（卡片 370px、胶囊 290px、Popup 420px，文字清晰舒适）。

            ---

            #### 🚀 极速安装步骤（Chrome / Edge 通用）
            1. 下载下方的 **`paperdict-${{ github.ref_name }}.zip`** 资源文件。
            2. 将下载的 ZIP 压缩包**解压到电脑任意文件夹**。
            3. 打开浏览器扩展管理页面：
               - Chrome 访问：`chrome://extensions/`
               - Edge 访问：`edge://extensions/`
            4. 打开右上角（或左下角）的 **「开发者模式」**。
            5. 点击 **「加载已解压的扩展程序」**（Load unpacked），选择刚才解压出来的文件夹即可开始使用！
            6. *(提示)* 若需直接在浏览器打开本地下载的 PDF 划词，请在扩展详细信息中勾选 **「允许访问文件网址」**。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
